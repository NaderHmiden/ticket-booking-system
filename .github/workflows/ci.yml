        #   run: |
        #     docker login -u ${{ secrets.DOCKER_USERNAME }} -p ${{ secrets.DOCKER_PASSWORD }}
        #     docker tag ticket-platform:latest moncompte/ticket-platform:latest
        #     docker push moncompte/ticket-platform:latest
