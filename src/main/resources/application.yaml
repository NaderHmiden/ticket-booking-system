spring:
  application:
    name: ticket-booking-system

  datasource:
    url: jdbc:postgresql://localhost:5432/ticket_booking
    username: tbs
    password: tbs

  jpa:
    hibernate:
      # Flyway owns the schema; Hibernate should only ever validate it.
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    # Each context gets its own migration subfolder so schema ownership stays
    # obvious: db/migration/catalog, db/migration/booking, etc. (added as each
    # context is built out in later steps).

  data:
    redis:
      host: localhost
      port: 6379

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: ticket-booking-system
      auto-offset-reset: earliest
    producer:
      acks: all

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  level:
    com.ticketbooking: INFO
