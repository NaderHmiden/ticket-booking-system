spring:
  application:
    name: ticket-booking-system

  datasource:
    url: jdbc:postgresql://localhost:5432/ticket_booking
    username: tbs
    password: tbs

  jpa:
    hibernate:
      # Flyway owns the schema; Hibernate should only ever validate it.
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db.migration
    repair-on-migrate: true

  data:
    redis:
      host: localhost
      port: 6379

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: ticket-booking-system
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

  booking:
    hold:
      ttl-seconds: 300

payment:
  stub:
    failure-rate: 0.1

app:
  cors:
    allowed-origins: http://localhost:5173,http://localhost:3000
  security:
    jwt-secret: ticket-booking-dev-secret-change-me-32b
    jwt-ttl-seconds: 86400

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  level:
    com.ticketbooking: INFO
