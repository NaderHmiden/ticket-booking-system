---
- name: Installer et configurer Docker pour Ticket Platform
  hosts: all
  become: yes # Exécuter en tant que root (sudo)

  tasks:
    - name: Mettre à jour les paquets apt
      apt:
        update_cache: yes

    - name: Installer les dépendances requises
      apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - software-properties-common
        state: present

    - name: Ajouter la clé GPG officielle de Docker
      apt_key:
        url: https://download.docker.com/linux/ubuntu/gpg
        state: present

    - name: Ajouter le dépôt Docker
      apt_repository:
        repo: deb [arch=amd64] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable
        state: present

    - name: Installer Docker CE et Docker Compose
      apt:
        name:
          - docker-ce
          - docker-compose-plugin
        state: present

    - name: S'assurer que le service Docker est démarré et activé au démarrage
      systemd:
        name: docker
        state: started
        enabled: yes

    - name: Créer le répertoire de l'application
      file:
        path: /opt/ticket-platform
        state: directory
        mode: '0755'
